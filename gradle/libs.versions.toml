[versions]
agp = "8.4.2"
kotlin = "1.9.24"
ksp = "1.9.24-1.0.20"
composeBom = "2024.05.00"
composeCompiler = "1.5.14"
room = "2.6.1"
navigationCompose = "2.7.7"
lifecycle = "2.8.2"
coroutines = "1.8.1"
coreKtx = "1.13.1"
activityCompose = "1.9.0"
playServicesLocation = "21.3.0"
datastorePreferences = "1.1.1"
